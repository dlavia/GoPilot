<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoPilot · widget completo (maqueta)</title>
<!-- Maqueta (2026-11-09): TODO lo que hace el widget hoy (MainWidget.xaml) con el estilo de widget-gamebar.html
     (menú de Legion L: fondo negro, pestañas de iconos, filas en tarjetas, foco blanco con resplandor).
     Pestañas: Inicio · Rendimiento · Pantalla · Mando · Sistema. Lo que antes eran tarjetas desplegables
     (Avanzado, curva, sticks, gatillos, giroscopio, luces, overlay, atajos, perfiles, actualizaciones) son subpáginas: A entra, B vuelve.
     Teclado: flechas · Intro/Espacio = A · Retroceso/Esc = B · Q/E = LT/RT · X = ocultar aviso. Ratón: clic = foco, otro clic = A. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --text: #F5F5F7; --text-2: rgba(245,245,247,.62); --text-3: rgba(245,245,247,.4); --ease: cubic-bezier(.2,.8,.2,1);
  --glow: 0 0 22px rgba(255,255,255,.32), 0 0 6px rgba(255,255,255,.25); --warn: #FFB547; --ok: #5BE08A; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; color: var(--text); font-family: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif; user-select: none; }
/* «Juego» de fondo (sin imágenes remotas): un paisaje oscuro hecho con degradados */
body { overflow: hidden; background:
  radial-gradient(ellipse 60% 40% at 72% 30%, rgba(255,196,110,.38), transparent 70%),
  radial-gradient(ellipse 90% 50% at 50% 100%, #1a1410 30%, transparent 70%),
  linear-gradient(180deg, #2b2a36 0%, #4a3b2e 45%, #231b15 70%, #0d0b09 100%); }
body::before { content: ""; position: fixed; inset: 0; background: rgba(0,0,0,.35); }
svg.ic { width: 1em; height: 1em; flex: none; fill: currentColor; display: block; }

/* Controles de la maqueta (no son parte del widget) */
.sizes { position: fixed; right: 20px; top: 16px; z-index: 5; display: flex; gap: 6px; font: 600 13px system-ui; }
.sizes button { border: 0; border-radius: 99px; padding: 7px 14px; background: rgba(255,255,255,.14); color: #fff; cursor: pointer; font: inherit; }
.sizes button.on { background: #fff; color: #000; }
.note { position: fixed; left: 20px; bottom: 12px; right: 20px; z-index: 5; font: 12px/1.4 system-ui; color: rgba(255,255,255,.6); }

/* Marco de la Game Bar */
.frame { position: absolute; left: 60px; top: 50px; width: var(--w, 480px); height: min(760px, calc(100vh - 90px)); border-radius: 10px; overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.6); transition: width .35s var(--ease); display: flex; flex-direction: column; }
@media (max-width: 700px) { .frame { left: 8px; top: 56px; width: min(var(--w), calc(100vw - 16px)); } .sizes { right: 8px; } .note { display: none; } }
.gbbar { height: 34px; flex: none; background: #2B2B2B; display: flex; align-items: center; gap: 10px; padding: 0 12px; font: 600 13px "Segoe UI", system-ui; color: #ddd; }
.gbbar .t { flex: 1; } .gbbar .ic { font-size: 15px; color: #bbb; }

/* El widget */
.w { flex: 1; min-height: 0; background: #000; display: flex; flex-direction: column; padding: 18px 22px 16px; position: relative; }
.top { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 700; }
.top .sys { display: flex; gap: 8px; align-items: center; font-weight: 600; } .top .ic { font-size: 18px; }
.tabs { display: flex; align-items: center; gap: 4px; margin: 0 0 4px; position: relative; }
.bump { height: 22px; min-width: 30px; padding: 0 6px; border-radius: 7px; border: 1px solid rgba(255,255,255,.2); display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,.4); }
.tb { height: 42px; padding: 0 12px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 0; font-size: 21px; color: var(--text-3); transition: color .25s; position: relative; z-index: 1; cursor: pointer; }
.tb b { font-size: 14.5px; font-weight: 700; max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; margin-left: 0;
  transition: max-width .38s var(--ease), opacity .25s, margin-left .38s var(--ease); }
.tb.on { color: #fff; } .tb.on b { max-width: 130px; opacity: 1; margin-left: 8px; }
.tb .dot[hidden] { display: none; }
.tb .dot { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.tabind { position: absolute; top: 0; height: 42px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1.5px solid rgba(255,255,255,.9);
  box-shadow: 0 0 18px rgba(255,255,255,.22); }
.tb .ic { display: block; margin: 0 auto; }
.tabs .grow { flex: 1; }

.body { position: relative; flex: 1; min-height: 0; margin: 10px -8px 0; overflow: hidden; }
.sec { position: absolute; inset: 0; padding: 8px 8px 12px; transition: opacity .1s ease, transform .18s var(--ease); overflow-y: auto; scrollbar-width: none; }
.sec::-webkit-scrollbar { display: none; }
.sec.out { opacity: 0; transform: translateX(var(--dx, 0px)); }
.frame.wide .cols { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); column-gap: 14px; align-content: start; }
.frame.wide .cols > .full { grid-column: 1 / -1; }
.frame.wide .cols > .item { margin-bottom: 8px; }

/* Cabecera de subpágina */
.crumb { display: flex; align-items: center; gap: 8px; margin: 2px 4px 14px; font-size: 20px; font-weight: 800; cursor: pointer; }
.crumb .ic { font-size: 18px; color: var(--text-2); }
.crumb small { font-size: 13px; font-weight: 600; color: var(--text-3); }
.crumb .g { margin-left: auto; }

.head { display: flex; gap: 14px; align-items: center; margin: 4px 0 16px; }
.cover { width: 54px; height: 81px; border-radius: 8px; flex: none; box-shadow: 0 8px 20px rgba(0,0,0,.5); display: grid; place-items: end start; padding: 6px;
  background: radial-gradient(circle at 60% 25%, #f3d38a, transparent 45%), linear-gradient(170deg, #6b5532, #1c140b 75%); font: 800 11px/1 "Hanken Grotesk"; letter-spacing: .06em; color: #f3e2b8; }
.head h1 { margin: 0; font-size: 23px; } .head .sub { margin-top: 4px; font-size: 13px; color: var(--text-2); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 0 14px; gap: 8px; }
.stats div { display: flex; flex-direction: column; gap: 3px; }
.stats b { font-size: 21px; font-variant-numeric: tabular-nums; } .stats b small { font-size: 13px; color: var(--text-2); margin-left: 2px; }
.stats span { font-size: 11px; color: var(--text-3); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }

.label { font-size: 11.5px; font-weight: 700; color: var(--text-3); letter-spacing: .08em; text-transform: uppercase; margin: 14px 6px 8px; display: flex; justify-content: space-between; }
.label i { font-style: normal; font-weight: 600; letter-spacing: .02em; text-transform: none; }
.hint { font-size: 12.5px; line-height: 1.45; color: var(--text-3); margin: 2px 6px 10px; }
.hint.warn { color: var(--warn); }
.item { min-height: 52px; border-radius: 15px; display: flex; align-items: center; gap: 13px; padding: 0 15px; font-size: 15.5px; font-weight: 600; color: var(--text-2); position: relative;
  background: rgba(28,29,36,.78); margin-bottom: 8px; cursor: pointer; transition: color .2s, background .2s; }
.item > .ic:first-child { font-size: 20px; width: 21px; }
.item .two { display: flex; flex-direction: column; gap: 2px; padding: 7px 0; flex: 1; min-width: 0; }
.item .two small { font-size: 12px; color: var(--text-3); font-weight: 500; }
.item .two small.warn { color: var(--warn); }
.item .right { margin-left: auto; flex: none; display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-3); font-weight: 600; }
.item .right .ic { font-size: 15px; }
.item::before { content: ""; position: absolute; inset: -4px; border-radius: 18px; border: 2px solid rgba(255,255,255,.95); opacity: 0; transition: opacity .2s; box-shadow: var(--glow); pointer-events: none; }
.item.focus { color: #fff; background: rgba(60,61,72,.9); } .item.focus::before { opacity: 1; }
.item.dis { opacity: .45; }
.item.banner { background: rgba(255,181,71,.12); color: #fff; } .item.banner > .ic:first-child { color: var(--warn); }
.item.banner.focus { background: rgba(255,181,71,.22); }
.item.danger .two > span { color: #ff8a80; }
.pills { display: flex; gap: 2px; } .pill { padding: 5px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; color: rgba(245,245,247,.45); white-space: nowrap; }
.pill.on { background: #fff; color: #111; }
.item:not(.focus) .pill.on { background: rgba(255,255,255,.75); }
.btns .pill { border: 1.5px solid rgba(255,255,255,.18); }
.btns .pill.on { border-color: transparent; }
.item:not(.focus) .btns .pill.on { background: transparent; color: rgba(245,245,247,.6); border-color: rgba(255,255,255,.18); }
.sw { width: 42px; height: 24px; border-radius: 99px; background: rgba(255,255,255,.2); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .18s var(--ease); }
.sw.on { background: #fff; } .sw.on::after { left: 21px; background: #111; }
.level { width: 120px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.16); position: relative; overflow: hidden; }
.level b { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; border-radius: 99px; transition: width .12s; }
.lv { min-width: 44px; text-align: right; font-size: 14px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.cyc { display: flex; align-items: center; gap: 6px; color: var(--text); font-weight: 700; }
.cyc .ic { font-size: 13px; color: var(--text-3); }
.item:not(.focus) .cyc .ic { opacity: 0; }
.sws { display: flex; gap: 5px; } .sws span { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; }
.sws span.on { border-color: #fff; box-shadow: 0 0 0 2px #000 inset; }
.frame:not(.wide) .item .right .level { width: 104px; }
.frame.narrow .item .two small { display: none; }
.frame.narrow .item.keep .two small { display: block; }
.frame.narrow .pill { padding: 5px 7px; font-size: 12px; }
.frame.narrow .sws span { width: 15px; height: 15px; }

/* Vistas previas (no tienen foco) */
.pv { border-radius: 15px; background: rgba(28,29,36,.5); margin-bottom: 8px; padding: 14px; display: flex; justify-content: space-around; align-items: center; gap: 14px; }
.pv figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-3); font-weight: 600; }
.curve { display: flex; align-items: flex-end; gap: 6px; height: 96px; width: 100%; }
.curve div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; font-size: 10px; color: var(--text-3); font-weight: 600; }
.curve div b { width: 100%; border-radius: 5px 5px 2px 2px; background: linear-gradient(#fff, rgba(255,255,255,.35)); transition: height .25s var(--ease); }
.trig { width: 46%; } .trig .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.12); position: relative; overflow: hidden; }
.trig .bar b { position: absolute; top: 0; bottom: 0; background: rgba(255,255,255,.85); border-radius: 99px; }
.ring { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: #111; position: relative; }
.ring::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #000; }
.ring.fx-solid { box-shadow: 0 0 calc(var(--b) * 28px) var(--c); background: var(--c); }
.ring.fx-breathe { background: var(--c); animation: breathe calc(3.2s - var(--s) * 2.4s) ease-in-out infinite; }
.ring.fx-chroma { background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); animation: spin calc(6s - var(--s) * 5s) linear infinite; }
.ring.fx-rainbow { background: var(--c); animation: hue calc(6s - var(--s) * 5s) linear infinite; }
.ring.fx-reactive { background: var(--c); animation: beat 1.1s infinite; }
.ring.fx-off { background: #222; }
@keyframes breathe { 50% { opacity: .25; } } @keyframes spin { to { transform: rotate(1turn); } } @keyframes hue { to { filter: hue-rotate(1turn); } }
@keyframes beat { 0%, 100% { opacity: var(--i); } 8% { opacity: var(--p); } 30% { opacity: var(--i); } 52% { opacity: calc((var(--p) + var(--i)) / 2); } 70% { opacity: var(--i); } }
.table { display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; font-size: 13.5px; padding: 14px 16px; border-radius: 15px; background: rgba(28,29,36,.5); margin-bottom: 8px; }
.table b { font-weight: 700; } .table span { color: var(--text-2); }
.news { padding: 14px 16px; border-radius: 15px; background: rgba(28,29,36,.5); margin-bottom: 8px; font-size: 13.5px; line-height: 1.55; color: var(--text-2); }
.news b { color: var(--text); display: block; margin-bottom: 4px; font-size: 14.5px; }
.news ul { margin: 0; padding-left: 18px; }

/* Pie: perfil a la izquierda, ayudas a la derecha */
.foot { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
.prof { height: 38px; padding: 0 14px 0 10px; border-radius: 999px; display: flex; align-items: center; gap: 8px; background: rgba(28,29,36,.85); font-size: 13.5px; font-weight: 700; cursor: pointer; min-width: 0; }
.prof .ic { font-size: 17px; color: var(--text-2); } .prof span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prof .ic.saved { color: var(--ok); }
.hints { margin-left: auto; height: 38px; padding: 0 6px; border-radius: 999px; display: flex; align-items: center; background: rgba(28,29,36,.85); font-size: 13.5px; font-weight: 600; flex: none; }
.hints span { display: flex; align-items: center; gap: 7px; padding: 0 9px; white-space: nowrap; }
.g { min-width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,.8); display: grid; place-items: center; font-size: 10px; font-weight: 800; padding: 0 5px; }
.frame.narrow .hints span { padding: 0 6px; font-size: 12.5px; }
.frame.narrow .hints.adj .opt { display: none; }
.prof { flex: 0 1 auto; }
.toast { position: absolute; left: 50%; bottom: 66px; transform: translate(-50%, 10px); opacity: 0; transition: opacity .2s, transform .25s var(--ease); background: #fff; color: #111;
  padding: 9px 16px; border-radius: 99px; font-size: 13.5px; font-weight: 700; pointer-events: none; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 3; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
/* Cambio de modo con Legion L + Y: aviso grande */
.big { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 4; }
.big div { background: rgba(0,0,0,.82); border: 1.5px solid rgba(255,255,255,.9); box-shadow: var(--glow); border-radius: 22px; padding: 22px 34px; text-align: center; opacity: 0; transform: scale(.94); transition: opacity .2s, transform .25s var(--ease); }
.big.on div { opacity: 1; transform: none; }
.big .ic { font-size: 40px; margin: 0 auto 8px; } .big b { display: block; font-size: 22px; } .big span { font-size: 14px; color: var(--text-2); }
</style>
</head>

function tools(kind) { return { ic: "wrench", t: "Herramientas", type: "btns", k: "_tool_" + kind, opts: ["Calibrar", "Probar", "Por defecto"], act: v => toast(["Calibrando… mueve y suelta", "Prueba en directo", "Valores por defecto"][v]) }; }

// ===================== Piezas visuales =====================
let live = { w: 24.1, fps: 58, t: 71, fan: 3200 };
function statsHtml() {
  return `<div class="stats full" id="stats"><div><b>${live.w.toFixed(1)}<small>W</small></b><span>Consumo</span></div><div><b>${live.fps}</b><span>FPS</span></div>
    <div><b>${live.t}<small>°C</small></b><span>Procesador</span></div><div><b>${(live.fan / 1000).toFixed(1)}<small>k rpm</small></b><span>Ventilador</span></div></div>`;
}
function stickSvg(n, c, b) {
  const R = 30, rc = R * c / 100, rb = R * b / 100;
  return `<figure><svg width="76" height="76" viewBox="-38 -38 76 76"><circle r="${R}" fill="#111" stroke="rgba(255,255,255,.18)"/><circle r="${rb}" fill="none" stroke="#fff" stroke-dasharray="3 3" stroke-width="1.5"/>
    <circle r="${Math.max(rc, 1)}" fill="rgba(255,255,255,.35)"/><circle r="3" fill="#fff"/></svg>${n}</figure>`;
}
function trigBar(n, a, b) { return `<figure class="trig"><div class="bar"><b style="left:${a}%;right:${100 - b}%"></b></div>${n} · ${a}–${b} %</figure>`; }
function lightsPreview() {
  const fx = ["solid", "breathe", "chroma", "rainbow", "reactive"][S.lightFx], c = COLORS[S.lightColor];
  const st = `--c:${c};--b:${S.lightBright / 100};--s:${S.lightSpeed / 100};--i:${S.lightIdle / 100};--p:${S.lightPeak / 100};opacity:${S.lightFx == 4 ? 1 : .35 + .65 * S.lightBright / 100}`;
  return `<div class="pv full"><figure><div class="ring fx-${fx}" style="${st}"></div>Izquierdo</figure><figure><div class="ring fx-${fx}" style="${st}"></div>Derecho</figure></div>`;
}

// ===================== Navegación =====================
let sec = 0, page = null, f = 0, armed = null, rows = [];
const memo = {};
const curKey = () => page || "s" + sec;
function resolve(r) {
  if (!r) return null;
  if (typeof r == "string") return { ...D[r], id: r };
  return r;
}
const val = (d, x) => typeof x == "function" ? x(d) : x;

// Pestañas: se construyen una vez y luego solo cambian de clase, así el nombre se despliega con su transición y el
// contorno se desliza de una a otra (antes se rehacían enteras y saltaban). Van centradas entre LT y RT.
let tabAnim = 0;
function tabs() {
  if (!$("#tabs .tb")) {
    $("#tabs").innerHTML = `<span class="bump">LT</span><span class="grow"></span><span class="tabind" id="tabind"></span>` + SECTIONS.map((s, i) =>
      `<div class="tb" data-i="${i}">${I(s.icon, false)}<b>${s.name}</b><span class="dot" hidden></span></div>`).join("")
      + `<span class="grow"></span><span class="bump">RT</span>`;
    $$(".tb").forEach(t => t.onclick = () => go2(+t.dataset.i));
  }
  $$(".tb").forEach((t, i) => {
    t.classList.toggle("on", i === sec);
    t.querySelector(".dot").hidden = !(SECTIONS[i].dot && SECTIONS[i].dot() && i !== sec);
  });
  // El contorno va de donde está a la pestaña elegida mientras su nombre se despliega (sigue su tamaño en cada fotograma)
  const ind = $("#tabind"), from = { l: ind.offsetLeft, w: ind.offsetWidth }, t0 = performance.now(), dur = 380, id = ++tabAnim;
  const first = !ind.style.width;
  (function step(now) {
    if (id !== tabAnim) return;
    const t = $(".tb.on"), k = first ? 1 : Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    ind.style.left = from.l + (t.offsetLeft - from.l) * e + "px";
    ind.style.width = (first ? t.offsetWidth : from.w + (t.offsetWidth - from.w) * e) + "px";
    if (now - t0 < dur + 80) requestAnimationFrame(step);
  })(t0);
}

function rightHtml(d) {
  const v = S[d.k];
  switch (d.type) {
    case "sw": return `<span class="sw ${v ? "on" : ""}"></span>`;
    case "pills": return `<span class="pills">${d.opts.map((t, i) => `<span class="pill ${i === v ? "on" : ""}">${t}</span>`).join("")}</span>`;
    case "btns": return `<span class="pills btns">${d.opts.map((t, i) => `<span class="pill ${i === (v || 0) ? "on" : ""}">${t}</span>`).join("")}</span>`;
    case "lvl": return `<span class="level"><b style="width:${(v - d.min) / (d.max - d.min) * 100}%"></b></span><span class="lv">${v}${d.u}</span>`;
    case "cyc": return `<span class="cyc">${I("caret-left", false)}<span>${d.opts[d.map ? v - 1 : v]}</span>${I("caret-right", false)}</span>`;
    case "swatch": return `<span class="sws">${d.opts.map((c, i) => `<span class="${i === v ? "on" : ""}" style="background:${c}"></span>`).join("")}</span>`;
    case "go": return `${d.right ? `<span>${d.right()}</span>` : ""}${I("caret-right", false)}`;
    default: return d.right ? d.right() : "";
  }
}
function rowHtml(d, i) {
  const dis = d.dis && d.dis(), key = curKey() + ":" + i;
  let s = val(d, d.s);
  let warn = d.warn && d.warn();
  if (armed === key && d.confirm) { s = d.confirm; warn = true; }
  const title = d.type == "ord" || d.type == "add" ? d.t : d.t;
  const icon = d.fill === false ? I(d.ic, false) : I(d.ic);
  const body = s ? `<span class="two"><span>${title}</span><small class="${warn ? "warn" : ""}">${s}</small></span>` : `<span class="two"><span>${title}</span></span>`;
  return `<div class="item ${d.cls || ""} ${dis ? "dis" : ""} ${d.keep ? "keep" : ""}" data-i="${i}">${icon}${body}<span class="right">${rightHtml(d)}</span></div>`;
}
function draw(keepScroll = true) {
  const list = (page ? PAGES[page].rows() : SECTIONS[sec].rows()).map(resolve).filter(Boolean);
  rows = [];
  let html = "";
  if (page) html += `<div class="crumb full" id="crumb">${I("caret-left", false)}<span>${PAGES[page].t}</span><small>· ${PAGES[page].from}</small></div>`;
  for (const r of list) {
    if (r.html !== undefined) { html += r.html; continue; }
    if (r.label) { html += `<div class="label full">${r.label}${r.aside ? `<i>${r.aside}</i>` : ""}</div>`; continue; }
    html += rowHtml(r, rows.length); rows.push(r);
  }
  const st = $("#sec").scrollTop;
  $("#rows").innerHTML = html;
  if (keepScroll) $("#sec").scrollTop = st;
  if (f >= rows.length) f = rows.length - 1;
  $$("#rows .item").forEach(e => e.onclick = ev => {
    const i = +e.dataset.i, d = rows[i], pill = ev.target.closest(".pills:not(.btns) .pill, .sws span");
    f = i; armed = null;
    if (pill && !(d.dis && d.dis())) { const n = [...pill.parentNode.children].indexOf(pill); if (S[d.k] !== n) { S[d.k] = n; d.on && d.on(); } return draw(); }
    if (ev.target.closest(".cyc .ic")) { adjust(ev.target.closest(".ic") === e.querySelector(".cyc .ic") ? -1 : 1); return; }
    if (e.classList.contains("focus") && ev.detail) press(); else paint();
  });
  const c = $("#crumb"); if (c) c.onclick = back;
  paint();
  prof();
}
function paint() {
  $$("#rows .item").forEach((e, i) => e.classList.toggle("focus", i === f));
  const el = $(`#rows .item[data-i="${f}"]`), sc = $("#sec");
  if (el) {
    const top = el.offsetTop - 16, bot = el.offsetTop + el.offsetHeight + 16;
    if (top < sc.scrollTop) sc.scrollTo({ top: f === 0 ? 0 : top, behavior: "smooth" });
    else if (bot > sc.scrollTop + sc.clientHeight) sc.scrollTo({ top: f === rows.length - 1 ? sc.scrollHeight : bot - sc.clientHeight, behavior: "smooth" });
  }
  hints();
}
function hints() {
  const d = rows[f], adj = d && ["pills", "lvl", "cyc", "swatch", "btns", "ord"].includes(d.type);
  // Selectores (pills, cyc, niveles, colores): solo con ◀▶; A no hace nada en ellos
  const a = !d ? "Elegir" : { sw: "Cambiar", go: "Abrir", btns: "Usar", act: "Elegir" }[d.type];
  $("#hints").classList.toggle("adj", !!adj);
  $("#hints").innerHTML = (a ? `<span><span class="g">A</span>${a}</span>` : "") + (adj ? `<span><span class="g">◀▶</span>${d.type == "ord" ? "Mover" : "Ajustar"}</span>` : "")
    + (page ? `<span><span class="g">B</span>Volver</span>` : `<span class="opt"><span class="g">LT RT</span>Secciones</span><span><span class="g">B</span>Cerrar</span>`);
}
function prof() {
  const p = PROFILES[S.profile];
  $("#prof").innerHTML = `${I(p.ic)}<span>${p.n}</span>${S.autoSave ? "" : I("floppy-disk", false).replace('class="ic"', 'class="ic saved"')}`;
  $("#prof").onclick = () => open("profiles");
  $("#prof").title = "Perfil aplicado · A para cambiarlo";
}

function slide(dir, fn) {
  const el = $("#sec");
  el.style.setProperty("--dx", -14 * dir + "px"); el.classList.add("out");
  clearTimeout(slide.t); slide.t = setTimeout(() => { fn(); el.scrollTop = 0; el.style.transition = "none"; el.style.setProperty("--dx", 14 * dir + "px"); void el.offsetWidth; el.style.transition = ""; el.classList.remove("out"); }, 100);
}
function go2(n) {
  if (n === sec && !page) return;
  if (n < 0 || n >= SECTIONS.length) return;
  memo[curKey()] = f;
  const dir = n >= sec ? 1 : -1;
  sec = n; page = null; f = memo[curKey()] || 0; armed = null; tabs();
  slide(dir, () => draw(false));
}
function open(p) { memo[curKey()] = f; page = p; f = 0; armed = null; slide(1, () => draw(false)); }
function back() { if (!page) return; page = null; f = memo[curKey()] || 0; armed = null; tabs(); slide(-1, () => draw(false)); }

function press() {
  const d = rows[f]; if (!d || (d.dis && d.dis())) return;
  const key = curKey() + ":" + f;
  if (d.confirm && armed !== key) { armed = key; draw(); return; }
  armed = null;
  switch (d.type) {
    case "sw": S[d.k] = !S[d.k]; break;
    case "go": return open(d.page);
    case "act": d.act(); break;
    case "btns": d.act(S[d.k] || 0); break;
    case "ord": S.home = S.home.filter(x => x !== d.id); toast(`«${d.t}» quitada de Inicio`); break;
    case "add": S.home.push(d.id); toast(`«${d.t}» añadida a Inicio`); break;
    default: return;
  }
  d.on && d.on();
  if (page !== null || true) { draw(); tabs(); }
}
function adjust(dir) {
  const d = rows[f]; if (!d || (d.dis && d.dis())) return false;
  const v = S[d.k];
  switch (d.type) {
    case "pills": case "swatch": case "btns": S[d.k] = Math.max(0, Math.min(d.opts.length - 1, (v || 0) + dir)); break;
    case "cyc": { const n = d.opts.length; S[d.k] = d.map ? ((v - 1 + dir + n) % n) + 1 : (v + dir + n) % n; break; }
    case "lvl": S[d.k] = Math.max(d.min, Math.min(d.max, v + dir * (d.step || 1))); break;
    case "ord": { const i = S.home.indexOf(d.id), j = i + dir; if (j < 0 || j >= S.home.length) return true; S.home.splice(i, 1); S.home.splice(j, 0, d.id); f += dir; break; }
    default: return false;
  }
  if (d.type == "pills" && d.on && v !== S[d.k]) d.on();
  draw();
  return true;
}
// Movimiento geométrico (sirve para una y dos columnas)
function move(dx, dy) {
  const items = $$("#rows .item"); const cur = items[f]; if (!cur) return;
  const a = cur.getBoundingClientRect(); let best = -1, bs = 1e9;
  items.forEach((e, i) => {
    if (i === f) return; const r = e.getBoundingClientRect();
    let s;
    if (dy) { const d = dy > 0 ? r.top - a.bottom : a.top - r.bottom; if (d < -2) return; s = d + Math.abs(r.left - a.left) * 3; }
    else { const d = dx > 0 ? r.left - a.right : a.left - r.right; if (d < -2) return; s = d + Math.abs(r.top - a.top) * 3; }
    if (s < bs) { bs = s; best = i; }
  });
  if (best >= 0) { f = best; armed = null; paint(); }
  else if (dy < 0) { $("#sec").scrollTo({ top: 0, behavior: "smooth" }); }
}
addEventListener("keydown", e => {
  const k = e.key;
  if (k === "ArrowDown") move(0, 1);
  else if (k === "ArrowUp") move(0, -1);
  else if (k === "ArrowLeft" || k === "ArrowRight") { const dir = k === "ArrowLeft" ? -1 : 1; if (!adjust(dir)) move(dir, 0); }
  else if (k === "Enter" || k === " ") press();
  else if (k === "Backspace" || k === "Escape") back();
  else if (k === "q" || k === "Q") go2(sec - 1);
  else if (k === "e" || k === "E") go2(sec + 1);
  else if ((k === "x" || k === "X") && S.banner && !page && sec === 0) { S.banner = false; toast("Aviso oculto para esta versión"); draw(); tabs(); }
  else if (k === "m" || k === "M") { S.mode = (S.mode + 1) % 5; bigMode(); draw(); }
  else return;
  e.preventDefault();
});

// ===================== Avisos =====================
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }
function bigMode() {
  const m = MODES[S.mode], el = $("#big");
  el.firstElementChild.innerHTML = `${I(m.ic)}<b>${m.n}</b><span>${m.w || (S.mode == 3 ? S.spl + " W" : S.autoTarget + " FPS objetivo")}</span>`;
  el.classList.add("on"); clearTimeout(bigMode.t); bigMode.t = setTimeout(() => el.classList.remove("on"), 1300);
}

// ===================== Datos en vivo =====================
const baseW = () => [9.6, 14.7, 23.8, S.spl * .95, (S.autoMin + S.autoMax) / 2][S.mode];
setInterval(() => {
  live.w = Math.max(3, baseW() + (Math.random() - .5) * 1.6);
  live.fps = Math.round((S.chill ? Math.min(S.chillMax, 30 + baseW() * 1.6) : 30 + baseW() * 1.6) * (S.afmf ? 2 : 1) + (Math.random() - .5) * 4);
  if (S.mode == 4) live.fps = Math.round(S.autoTarget * (S.afmf ? 2 : 1) + (Math.random() - .5) * 3);
  live.t = Math.round(52 + baseW() * .8 + (Math.random() - .5) * 2);
  live.fan = S.fanMax ? 5400 : Math.round(1800 + baseW() * 60 + (Math.random() - .5) * 100);
  const st = $("#stats"); if (st) st.outerHTML = statsHtml();
  const g = $("#gdot"); if (g && S.gyro) { g.style.left = 27 + (Math.random() - .5) * 30 * S.gyroSens / 50 + "px"; g.style.top = 27 + (Math.random() - .5) * 30 * S.gyroSens / 50 + "px"; }
}, 1000);

function size(w) {
  const fr = $("#frame"); fr.style.setProperty("--w", w + "px");
  fr.classList.toggle("wide", w >= 700); fr.classList.toggle("narrow", w < 520);
  $$("#sizes button").forEach(b => b.classList.toggle("on", +b.dataset.w === w));
  setTimeout(() => { tabs(); paint(); }, 380);
}
$$("#sizes button").forEach(b => b.onclick = () => size(+b.dataset.w));
tabs(); draw(); size(480);
</script>
</body>
</html>
